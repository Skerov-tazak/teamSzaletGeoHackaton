[project]
name = "field-under-pressure"
version = "0.1.0"
description = "Field Under Pressure — AI assistant (RAG over IOR crop-protection guides)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf==2.1",
    "openpyxl==3.1.5",
    "sentence-transformers==6.3.0",
    "transformers==5.23.0",
    "torch==2.15.0",
    "qdrant-client==1.20.0",
    "rank-bm25==0.2.2",
    "pystempel==2.0.0",
    "rapidfuzz==3.14.6",
    "pyyaml==6.0.3",
    "numpy==2.5.5",
    "tqdm==4.70.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false
