<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa · podgląd deweloperski</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/frontend/dist/map-dev/harness.css">
  <script type="module" src="/static/frontend/dist/map-dev/harness.js"></script>
</head>
<body>
  <header class="dev-head">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 20c0-8 5-14 16-16-1 9-6 15-14 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 19 13 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <span class="name">Cropilot</span>
      <span class="dev-tag">podgląd mapy</span>
    </div>
    <div id="date-control" class="date-control" role="group" aria-label="Data demo">
      <button id="date-prev" aria-label="Dzień wcześniej">‹</button>
      <label class="date-box"><span id="date-label">…</span><input id="date-input" type="date" aria-label="Wybierz datę demo"></label>
      <button id="date-next" aria-label="Dzień później">›</button>
      <button id="date-week" class="wide">+7 dni</button>
    </div>
  </header>
  <main class="dev-main">
    <div id="map"></div>
    <aside class="dev-chat" aria-label="Zastępstwo czatu">
      <div class="chat-title">Czat <small>(zastępstwo)</small></div>
      <p id="asking" class="asking">Pytasz o całe gospodarstwo</p>
      <label class="chat-label">Pole <select id="chat-field"></select></label>
      <div class="chat-buttons">
        <button id="chat-focus">field:focus</button>
        <button id="chat-updated">risks:updated</button>
      </div>
      <div class="chat-title small">Zdarzenia</div>
      <ol id="event-log" class="event-log"></ol>
    </aside>
  </main>
</body>
</html>
